name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Worker secrets
        shell: bash
        env:
          CF_ADMIN_PIN: ${{ secrets.CF_ADMIN_PIN }}
          CF_ALLOWED_ORIGIN: ${{ secrets.CF_ALLOWED_ORIGIN }}
        run: |
          printf "%s" "$CF_ADMIN_PIN" | npx wrangler secret put ADMIN_PIN
          printf "%s" "$CF_ALLOWED_ORIGIN" | npx wrangler secret put ALLOWED_ORIGIN

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply estudiantes-tbo --remote

      - name: Deploy Worker
        run: npx wrangler deploy
